name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCODE_CHANNEL: prod
  GH_REPO: IAMGENESISAI/code

jobs:
  build-cli:
    name: cli (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: darwin-arm64
          - os: windows-latest
            label: windows-x64
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "OPENCODE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION}"

      - name: Build CLI
        run: bun ./packages/opencode/script/build.ts --single

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.label }}
          path: |
            packages/opencode/dist/opencode-*
          if-no-files-found: error

  build-desktop:
    name: desktop (${{ matrix.label }})
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac-arm64
            flags: --mac --arm64
          - os: windows-latest
            label: win-x64
            flags: --win
          - os: ubuntu-latest
            label: linux-x64
            flags: --linux
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "OPENCODE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION}"

      - name: Prepare desktop
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build desktop app
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run build

      - name: Package desktop
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.flags }} --publish never --config electron-builder.config.ts

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.label }}
          path: |
            packages/desktop/dist/code-desktop-*
            packages/desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    name: publish release
    if: always() && needs.build-cli.result == 'success'
    needs:
      - build-cli
      - build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          if [ -d artifacts ]; then
            find artifacts -type f \( -name 'opencode-*' -o -name 'code-desktop-*' -o -name 'latest*.yml' \) -exec cp {} release-assets/ \;
          fi
          cp install release-assets/install
          chmod +x release-assets/install
          if ! compgen -G "release-assets/opencode-*" > /dev/null; then
            echo "No CLI artifacts found"
            exit 1
          fi
          ls -la release-assets/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --repo "${GH_REPO}" \
            --title "${TAG}" \
            --generate-notes \
            release-assets/*